name: Build AI Paper Polish Addin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Install VSTO workload (Office/SharePoint)
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          if (-not (Test-Path $installer)) {
            $installer = "$env:ProgramFiles\Microsoft Visual Studio\Installer\vs_installer.exe"
          }

          if (Test-Path $installer) {
            $vswhere = Join-Path (Split-Path $installer) "vswhere.exe"
            $vsPath = if (Test-Path $vswhere) { & $vswhere -latest -property installationPath } else { "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" }
            Write-Host "VS installed at: $vsPath"

            $vstoDir = Join-Path $vsPath "MSBuild\Microsoft\VisualStudio"
            $target = Get-ChildItem $vstoDir -Recurse -Filter "Microsoft.VisualStudio.Tools.Office.targets" -ErrorAction SilentlyContinue
            if ($target) {
              Write-Host "VSTO already installed: $($target[0].FullName)"
            } else {
              Write-Host "VSTO not found. Installing Office workload..."
              $argString = 'modify --installPath "' + $vsPath.TrimEnd('\') + '" --add Microsoft.VisualStudio.Workload.Office --includeRecommended --quiet --wait --norestart'
              Write-Host "Running installer..."
              $proc = Start-Process -FilePath $installer -ArgumentList $argString -Wait -NoNewWindow -PassThru
              Write-Host "Exit code: $($proc.ExitCode)"
              if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
                throw "Failed to install VSTO (exit code: $($proc.ExitCode))"
              }
            }
          } else {
            Write-Host "No VS found. Downloading VS Build Tools..."
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_buildtools.exe" -OutFile "vs_buildtools.exe"
            $argString = '--quiet --wait --norestart --installPath "C:\VS_BT" --add Microsoft.VisualStudio.Workload.Office --includeRecommended'
            $proc = Start-Process -FilePath "vs_buildtools.exe" -ArgumentList $argString -Wait -NoNewWindow -PassThru
            if ($proc.ExitCode -ne 0) { throw "VS Build Tools install failed (exit code: $($proc.ExitCode))" }
            $env:Path = "C:\VS_BT\MSBuild\Current\Bin;$env:Path"
          }

      - name: Fix VSTO targets path (junction for VS2026+)
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $v18 = Join-Path $vsPath "MSBuild\Microsoft\VisualStudio\v18.0"
          $officeDir = Join-Path $v18 "Office"
          $officeToolsDir = Join-Path $v18 "OfficeTools"
          if ((Test-Path $officeToolsDir) -and -not (Test-Path $officeDir)) {
            Write-Host "Creating junction: $officeDir -> $officeToolsDir"
            cmd.exe /c "mklink /J `"$officeDir`" `"$officeToolsDir`""
          } elseif (Test-Path $officeDir) {
            Write-Host "Office directory already exists: $officeDir"
          } else {
            Write-Host "Neither Office nor OfficeTools found at $v18"
          }

      - name: Download and install VSTO Runtime
        shell: pwsh
        run: |
          # Use Microsoft's permanent fwlink (aka.ms/vstoruntimeredist is broken -> redirects to Bing)
          $url = "http://go.microsoft.com/fwlink/?LinkId=158918"
          Write-Host "Downloading VSTO Runtime from $url"
          Invoke-WebRequest -Uri $url -OutFile "vstor_redist.exe" -ErrorAction Stop
          $size = (Get-Item "vstor_redist.exe").Length
          if ($size -lt 100000) { throw "Downloaded file too small ($size bytes) - likely not a valid exe" }
          Write-Host "Downloaded: $size bytes"
          Write-Host "Installing VSTO Runtime (silent)..."
          $proc = Start-Process -FilePath ".\vstor_redist.exe" -ArgumentList "/quiet /norestart" -Wait -NoNewWindow -PassThru
          Write-Host "Install exit code: $($proc.ExitCode)"
          # Also extract MSI via /layout as fallback for DLL extraction
          Write-Host "Layout/MSI extraction as fallback..."
          $layoutDir = "$env:RUNNER_TEMP\vsto_layout"
          New-Item -ItemType Directory -Force -Path $layoutDir | Out-Null
          Start-Process -FilePath ".\vstor_redist.exe" -ArgumentList "/layout `"$layoutDir`" /quiet" -Wait -NoNewWindow -PassThru
          $msi = Get-ChildItem $layoutDir -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Write-Host "MSI found: $($msi.FullName)"
            $extractDir = "$env:RUNNER_TEMP\vsto_extract"
            New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
            Start-Process msiexec -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$extractDir`"" -Wait -NoNewWindow -PassThru
            Write-Host "MSI extracted to $extractDir"
          }

      - name: Download Office PIA (for Microsoft.Office.Core.dll)
        shell: pwsh
        run: |
          # Office 2010 PIA Redistributable provides Microsoft.Office.Core.dll
          # which is required as a transitive dependency of VSTO runtime assemblies.
          # Available from: https://www.microsoft.com/en-us/download/details.aspx?id=3508
          $url = "https://download.microsoft.com/download/c/1/d/c1d6dbbb-700d-4669-98cf-820ac3ae8e55/PIARedist.exe"
          Write-Host "Downloading Office 2010 PIA Redistributable..."
          Invoke-WebRequest -Uri $url -OutFile "PIARedist.exe" -ErrorAction Stop
          Write-Host "Downloaded: $((Get-Item PIARedist.exe).Length) bytes"

          # Extract MSI via /layout
          $piaExtractDir = "$env:RUNNER_TEMP\pia_extract"
          New-Item -ItemType Directory -Force -Path $piaExtractDir | Out-Null
          Write-Host "Extracting PIA MSI..."
          Start-Process -FilePath ".\PIARedist.exe" -ArgumentList "/layout `"$piaExtractDir`" /quiet" -Wait -NoNewWindow -PassThru

          # Extract files from MSI
          $msi = Get-ChildItem $piaExtractDir -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Write-Host "MSI found: $($msi.FullName)"
            $extractDir = "$env:RUNNER_TEMP\pia_msi_extract"
            New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
            Start-Process msiexec -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$extractDir`"" -Wait -NoNewWindow -PassThru
            $dll = Get-ChildItem $extractDir -Filter "Microsoft.Office.Core.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($dll) {
              Write-Host "Found Microsoft.Office.Core.dll at $($dll.FullName)"
              New-Item -ItemType Directory -Force -Path lib | Out-Null
              Copy-Item $dll.FullName lib\Microsoft.Office.Core.dll -Force
              Write-Host "Copied to lib\Microsoft.Office.Core.dll"
            } else {
              Write-Host "WARNING: Microsoft.Office.Core.dll not found in PIA MSI extraction"
            }
          } else {
            Write-Host "WARNING: No MSI found in PIA extraction"
            # Try listing what was extracted
            Get-ChildItem $piaExtractDir -Recurse | Select-Object -First 30 | ForEach-Object { Write-Host "  $($_.FullName)" }
          }

      - name: Stage VSTO reference assemblies
        shell: pwsh
        run: |
          # Copy VSTO DLLs to project's lib\ dir (used by csproj HintPath)
          New-Item -ItemType Directory -Force -Path lib | Out-Null
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $vsRefDir = Join-Path $vsPath "Common7\IDE\ReferenceAssemblies\v4.0"
          $piaDir = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Shared\Visual Studio Tools for Office\PIA\Office15"
          $gacRoot = "C:\Windows\Microsoft.NET\assembly"

          # --- 3 VSTO runtime assemblies ---
          $needed = @("Microsoft.Office.Tools.Common.v4.0.Utilities", "Microsoft.Office.Tools.v4.0.Framework", "Microsoft.VisualStudio.Tools.Applications.Runtime")
          foreach ($asm in $needed) {
            $dest = Join-Path lib "$asm.dll"
            if (Test-Path $dest) { Write-Host "$asm OK"; continue }
            $path = Join-Path $vsRefDir "$asm.dll"
            if (Test-Path $path) { Copy-Item $path $dest -Force; Write-Host "$asm copied from VS"; continue }
            $dlls = Get-ChildItem $gacRoot -Filter "$asm.dll" -Recurse -Depth 6 -ErrorAction SilentlyContinue
            if ($dlls) { Copy-Item $dlls[0].FullName $dest -Force; Write-Host "$asm copied from GAC"; continue }
            throw "FATAL: $asm.dll not found!"
          }

          # --- Microsoft.Office.Core (needed by VSTO types for COM interop) ---
          $coreDll = "Microsoft.Office.Core.dll"
          $coreDest = Join-Path lib $coreDll
          if (-not (Test-Path $coreDest)) {
            # Search order: PIA dir, VS ref dir, GAC, MSI extract, broad search
            $found = $null
            if (Test-Path (Join-Path $piaDir $coreDll)) {
              $found = Join-Path $piaDir $coreDll
            } elseif (Test-Path (Join-Path $vsRefDir $coreDll)) {
              $found = Join-Path $vsRefDir $coreDll
            } else {
              $foundGac = Get-ChildItem $gacRoot -Filter $coreDll -Recurse -Depth 6 -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($foundGac) { $found = $foundGac.FullName }
            }
            if (-not $found) {
              # Search VSTO Runtime MSI extraction
              $extractDir = "$env:RUNNER_TEMP\vsto_extract"
              if (Test-Path $extractDir) {
                $foundMsi = Get-ChildItem $extractDir -Filter $coreDll -Recurse -Depth 4 -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($foundMsi) { $found = $foundMsi.FullName }
              }
            }
            if ($found) {
              Copy-Item $found $coreDest -Force
              Write-Host "$coreDll copied from $found"
            } else {
              Write-Host "WARNING: $coreDll not found in known locations. Searching disk..."
              $broad = Get-ChildItem "C:\Program Files" -Filter $coreDll -Recurse -Depth 8 -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($broad) { Copy-Item $broad.FullName $coreDest -Force; Write-Host "$coreDll found at $($broad.FullName)" }
              else { Write-Host "WARNING: $coreDll not found anywhere - build may fail" }
            }
          } else {
            Write-Host "$coreDll OK"
          }

          Write-Host "All VSTO reference assemblies staged to lib\ successfully."
          Get-ChildItem lib | ForEach-Object { Write-Host "  lib\$($_.Name) ($($_.Length) bytes)" }

      - name: Verify staged DLLs
        shell: pwsh
        run: |
          $needed = @("Microsoft.Office.Tools.Common.v4.0.Utilities", "Microsoft.Office.Tools.v4.0.Framework", "Microsoft.VisualStudio.Tools.Applications.Runtime")
          foreach ($asm in $needed) {
            $dll = Join-Path lib "$asm.dll"
            Write-Host "--- $dll ---"
            if (-not (Test-Path $dll)) { throw "MISSING: $dll" }
            Write-Host "  Size: $((Get-Item $dll).Length) bytes"
            try {
              $a = [System.Reflection.Assembly]::LoadFrom((Resolve-Path $dll))
              Write-Host "  FullName: $($a.FullName)"
              Write-Host "  Location: $($a.Location)"
              $types = $a.GetExportedTypes() | ForEach-Object { $_.FullName }
              Write-Host "  Exported types ($($types.Count)):"
              $types | ForEach-Object { Write-Host "    $_" }
            } catch {
              Write-Host "  Load error: $_"
            }
          }

      - name: Build VSTO project
        shell: pwsh
        run: |
          Write-Host "Starting build..."
          # Resolve VS reference assemblies path for VSTO (workaround for MSBuild bug #7617:
          # AssemblyFolders.config may be missing or not include VSTO paths on build server)
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $vstoRefPath = Join-Path $vsPath "Common7\IDE\ReferenceAssemblies\v4.0"
          Write-Host "VSTO ReferencePath: $vstoRefPath"
          msbuild AIPolishCOMAddin.csproj /restore /t:Build "/p:Configuration=Release" "/p:Platform=AnyCPU" /p:SignAssembly=false "/p:ReferencePath=$vstoRefPath" /p:UseSharedCompilation=false /v:n
          if ($LASTEXITCODE -ne 0) { throw "Build failed (exit $LASTEXITCODE)" }
          Write-Host "BUILD SUCCEEDED!"

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish
          Copy-Item "bin\Release\AIPolishCOMAddin.dll" "publish\" -ErrorAction Stop
          Copy-Item "install.bat", "uninstall.bat", "Register_Addin.reg", "Unregister_Addin.reg", "README.md" "publish\"
          $h = Get-FileHash "publish\AIPolishCOMAddin.dll" -Algorithm SHA256
          Set-Content "publish\AIPolishCOMAddin.dll.sha256" $h.Hash

      - uses: actions/upload-artifact@v4
        with:
          name: AIPolishCOMAddin-Release
          path: publish/
          if-no-files-found: error
