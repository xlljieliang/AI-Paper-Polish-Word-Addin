name: Build AI Paper Polish Addin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Install VSTO workload (Office/SharePoint)
        shell: pwsh
        run: |
          # Locate vs_installer
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          if (-not (Test-Path $installer)) {
            $installer = "$env:ProgramFiles\Microsoft Visual Studio\Installer\vs_installer.exe"
          }

          if (Test-Path $installer) {
            # Find VS installation path using vswhere
            $vswhere = Join-Path (Split-Path $installer) "vswhere.exe"
            if (Test-Path $vswhere) {
              $vsPath = & $vswhere -latest -property installationPath
              Write-Host "VS installed at: $vsPath"
            } else {
              $vsPath = "C:\Program Files\Microsoft Visual Studio\18\Enterprise"
            }

            # Check if VSTO targets already exist
            $targetsPath = Join-Path $vsPath "MSBuild\Microsoft\VisualStudio\v18.0\Office\Microsoft.VisualStudio.Tools.Office.targets"
            if (Test-Path $targetsPath) {
              Write-Host "VSTO targets already installed at: $targetsPath"
            } else {
              Write-Host "VSTO targets not found. Installing Office workload..."
              $proc = Start-Process -FilePath $installer -ArgumentList @(
                "modify",
                "--installPath", $vsPath,
                "--add", "Microsoft.VisualStudio.Workload.Office",
                "--includeRecommended",
                "--quiet",
                "--wait",
                "--norestart"
              ) -Wait -NoNewWindow -PassThru
              if ($proc.ExitCode -eq 0 -or $proc.ExitCode -eq 3010) {
                Write-Host "VSTO workload installed successfully"
              } else {
                Write-Host "Installer exit code: $($proc.ExitCode)"
                throw "Failed to install VSTO workload"
              }
            }
          } else {
            Write-Host "No VS installer found. Installing VS Build Tools with Office workload..."
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_buildtools.exe" -OutFile "vs_buildtools.exe"
            $proc = Start-Process -FilePath "vs_buildtools.exe" -ArgumentList @(
              "--quiet", "--wait", "--norestart",
              "--installPath", "C:\VS_BT",
              "--add", "Microsoft.VisualStudio.Workload.Office",
              "--add", "Microsoft.VisualStudio.Workload.ManagedDesktop",
              "--includeRecommended"
            ) -Wait -NoNewWindow -PassThru
            if ($proc.ExitCode -eq 0 -or $proc.ExitCode -eq 3010) {
              Write-Host "VS Build Tools installed successfully"
            } else {
              throw "VS Build Tools install failed with code $($proc.ExitCode)"
            }
          }

      - name: Build VSTO project
        shell: pwsh
        run: |
          Write-Host "Starting build..."
          msbuild AIPolishCOMAddin.csproj /restore /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /p:SignAssembly=false /v:m
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
          Write-Host "BUILD SUCCEEDED!"

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish
          Copy-Item "bin\Release\AIPolishCOMAddin.dll" "publish\" -ErrorAction Stop
          Copy-Item "install.bat", "uninstall.bat", "Register_Addin.reg", "Unregister_Addin.reg", "README.md" "publish\"
          $h = Get-FileHash "publish\AIPolishCOMAddin.dll" -Algorithm SHA256
          Set-Content "publish\AIPolishCOMAddin.dll.sha256" $h.Hash

      - uses: actions/upload-artifact@v4
        with:
          name: AIPolishCOMAddin-Release
          path: publish/
          if-no-files-found: error
