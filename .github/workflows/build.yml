name: 🏗️ 编译 AI论文润色助手

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**/*.resx'
  workflow_dispatch:   # 支持手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🧰 设置 MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 🔍 检查 VSTO 编译环境
        id: vsto_check
        shell: pwsh
        run: |
          Write-Host "检查 VSTO 编译目标文件..."
          $vstoTargets = "Microsoft.VisualStudio.Tools.Office.targets"
          $targetsPath = & where.exe /R "$env:ProgramFiles" $vstoTargets 2>$null
          if (-not $targetsPath) {
              $targetsPath = & where.exe /R "${env:ProgramFiles(x86)}" $vstoTargets 2>$null
          }
          if (-not $targetsPath) {
              $targetsPath = & where.exe /R "$env:VSINSTALLDIR" $vstoTargets 2>$null
          }
          if ($targetsPath) {
              Write-Host "✅ 找到 VSTO 目标: $targetsPath"
          } else {
              Write-Host "⚠️ VSTO 目标未找到，需要安装 Office 工作负载..."
              Write-Host "::set-output name=need_vsto::true"
          }

          # 检查 .NET Framework 4.8 目标包
          $net48Path = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8"
          if (Test-Path $net48Path) {
              Write-Host "✅ .NET Framework 4.8 目标包已安装"
          } else {
              Write-Host "⚠️ .NET Framework 4.8 目标包未找到"
          }

      - name: ⚙️ 安装 Visual Studio Office/SharePoint 工作负载（如需要）
        if: ${{ steps.vsto_check.outputs.need_vsto == 'true' }}
        shell: pwsh
        run: |
          Write-Host "正在安装 VS Office 工作负载（约 1-3 分钟）..."

          # 查找 vs_installer.exe
          $installerPaths = @(
              "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe",
              "C:\Program Files\Microsoft Visual Studio\Installer\vs_installer.exe"
          )

          $vsInstaller = $null
          foreach ($path in $installerPaths) {
              if (Test-Path $path) {
                  $vsInstaller = $path
                  break
              }
          }

          if ($vsInstaller) {
              Write-Host "使用安装器: $vsInstaller"

              # 先查找已安装的 VS 实例
              $vswhere = Join-Path (Split-Path $vsInstaller) "vswhere.exe"
              if (Test-Path $vswhere) {
                  $vsPath = & $vswhere -latest -property installationPath
                  Write-Host "找到 VS 实例: $vsPath"
              }

              if ($vsPath) {
                  # 修改现有安装，添加 Office 工作负载
                  Start-Process -Wait -FilePath $vsInstaller -ArgumentList @(
                      "modify",
                      "--installPath", "`"$vsPath`"",
                      "--add", "Microsoft.VisualStudio.Workload.Office",
                      "--includeRecommended",
                      "--quiet",
                      "--wait",
                      "--norestart"
                  ) -NoNewWindow
              }
          } else {
              Write-Host "⚠️ 未找到 vs_installer.exe，下载 Build Tools..."
              $downloader = "vs_BuildTools.exe"
              Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_buildtools.exe" -OutFile $downloader

              Start-Process -Wait -FilePath $downloader -ArgumentList @(
                  "--quiet",
                  "--wait",
                  "--norestart",
                  "--installPath", "C:\VS_BT",
                  "--add", "Microsoft.VisualStudio.Workload.Office",
                  "--add", "Microsoft.VisualStudio.Workload.ManagedDesktop",
                  "--includeRecommended"
              ) -NoNewWindow

              # 把新安装的 MSBuild 加入 PATH
              $env:Path = "C:\VS_BT\MSBuild\Current\Bin;$env:Path"
          }

          Write-Host "✅ Office 工作负载安装完成"

      - name: 🔑 生成临时签名密钥
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Subject "CN=AIPolishCI" -CertStoreLocation "Cert:\CurrentUser\My" -Type CodeSigning -KeyExportPolicy Exportable
          $pwd = ConvertTo-SecureString -String "ci@build" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "AIPolishCOMAddin_TemporaryKey.pfx" -Password $pwd
          Write-Host "✅ 签名密钥已生成"

      - name: 🏗️ 编译 VSTO 项目
        shell: pwsh
        run: |
          Write-Host "开始编译 VSTO 项目..."
          $logFile = "msbuild.log"

          msbuild AIPolishCOMAddin.csproj `
              /restore `
              /t:Rebuild `
              /p:Configuration=Release `
              /p:Platform="Any CPU" `
              /p:SignAssembly=false `
              /p:VSTO_TrustAssembliesLocation=true `
              /fl "/flp:LogFile=$logFile;Verbosity=minimal" `
              /v:m

          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ 编译失败！错误日志："
              if (Test-Path $logFile) {
                  Get-Content $logFile -Tail 60
              }
              exit 1
          } else {
              Write-Host "✅ 编译成功！"
          }

      - name: 📦 打包发布产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish

          # 检查编译产物
          $dllPath = "bin\Release\AIPolishCOMAddin.dll"
          if (-not (Test-Path $dllPath)) {
              $dllPath = "bin\Release\AIPolishCOMAddin.dll"
          }

          if (Test-Path $dllPath) {
              Copy-Item $dllPath "publish\AIPolishCOMAddin.dll"
              Write-Host "✅ 复制 dll: $dllPath"
          } else {
              Write-Host "❌ 未找到编译产物！"
              Get-ChildItem bin -Recurse -Filter *.dll | Select-Object FullName
              exit 1
          }

          # 复制安装文件
          @("install.bat", "uninstall.bat", "Register_Addin.reg",
            "Unregister_Addin.reg", "README.md") | ForEach-Object {
              if (Test-Path $_) {
                  Copy-Item $_ "publish\$_"
              }
          }

          # 生成校验哈希
          $hash = Get-FileHash "publish\AIPolishCOMAddin.dll" -Algorithm SHA256
          Set-Content "publish\AIPolishCOMAddin.dll.sha256" -Value $hash.Hash

          Write-Host "📦 发布包:"
          Get-ChildItem publish | Format-Table Name, Length

      - name: ⬆️ 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: AIPolishCOMAddin-Release
          path: publish/
          if-no-files-found: error

      - name: 📋 发布摘要
        shell: pwsh
        run: |
          $buildTime = (Get-Date).ToString("yyyy-MM-dd HH:mm:ss UTC")

@"
# ✅ 编译完成！

| 项目 | 信息 |
|------|------|
| 编译时间 | $buildTime |
| 运行环境 | github-actions (windows-latest) |

## 📥 下载

当前页面底部的 **Artifacts** → **AIPolishCOMAddin-Release** 下载。

## 🚀 安装步骤

1. 下载并解压
2. 将文件夹放到固定位置（如 `D:\Tools\AIPolish\`）**安装后不要移动！**
3. 双击 `install.bat`
4. 打开 **Word** → **文件** → **选项** → **加载项**
5. **管理: COM加载项** → **转到**
6. 勾选 **AI论文润色助手** → **确定**
"@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
