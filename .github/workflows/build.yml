name: Build AI Paper Polish Addin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Check VSTO environment
        shell: pwsh
        run: |
          $found = $false
          $paths = @(
            "$env:ProgramFiles"
            "${env:ProgramFiles(x86)}"
          )
          foreach ($p in $paths) {
            $r = Get-ChildItem $p -Recurse -Filter "Microsoft.VisualStudio.Tools.Office.targets" -ErrorAction SilentlyContinue
            if ($r) { Write-Host "FOUND VSTO: $($r[0].FullName)"; $found = $true }
          }
          if (-not $found) { Write-Host "NEED_VSTO=true" }

      - name: Install Office workload if needed
        if: failure()
        shell: pwsh
        run: |
          $p = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          if (-not (Test-Path $p)) { $p = "C:\Program Files\Microsoft Visual Studio\Installer\vs_installer.exe" }
          if (Test-Path $p) {
            & $p modify --installPath "$((& $p.Substring(0,$p.LastIndexOf('\')) + '\vswhere.exe') -latest -property installationPath)" --add Microsoft.VisualStudio.Workload.Office --includeRecommended --quiet --wait --norestart
          }

      - name: Generate signing key
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Subject "CN=CI" -CertStoreLocation "Cert:\CurrentUser\My" -Type CodeSigning -KeyExportPolicy Exportable
          $pwd = ConvertTo-SecureString "pwd" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "AIPolishCOMAddin_TemporaryKey.pfx" -Password $pwd

      - name: Build
        shell: pwsh
        run: |
          msbuild AIPolishCOMAddin.csproj /restore /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /p:SignAssembly=false /v:m
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish
          Copy-Item "bin\Release\AIPolishCOMAddin.dll" "publish\" -ErrorAction SilentlyContinue
          Copy-Item "install.bat" "publish\" -ErrorAction SilentlyContinue
          Copy-Item "uninstall.bat" "publish\" -ErrorAction SilentlyContinue
          Copy-Item "Register_Addin.reg" "publish\" -ErrorAction SilentlyContinue
          Copy-Item "Unregister_Addin.reg" "publish\" -ErrorAction SilentlyContinue
          Copy-Item "README.md" "publish\" -ErrorAction SilentlyContinue
          $h = Get-FileHash "publish\AIPolishCOMAddin.dll" -Algorithm SHA256
          Set-Content "publish\AIPolishCOMAddin.dll.sha256" $h.Hash

      - uses: actions/upload-artifact@v4
        with:
          name: AIPolishCOMAddin-Release
          path: publish/
          if-no-files-found: error

      - name: Summary
        shell: pwsh
        run: 'Write-Output "Build complete. Download from Artifacts." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append'
