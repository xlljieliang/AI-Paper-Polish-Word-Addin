name: Build AI Paper Polish Addin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Install VSTO workload (Office/SharePoint)
        timeout-minutes: 15
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          if (-not (Test-Path $installer)) {
            $installer = "$env:ProgramFiles\Microsoft Visual Studio\Installer\vs_installer.exe"
          }

          if (Test-Path $installer) {
            $vswhere = Join-Path (Split-Path $installer) "vswhere.exe"
            $vsPath = if (Test-Path $vswhere) { & $vswhere -latest -property installationPath } else { "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" }
            Write-Host "VS installed at: $vsPath"

            $vstoDir = Join-Path $vsPath "MSBuild\Microsoft\VisualStudio"
            $target = Get-ChildItem $vstoDir -Recurse -Filter "Microsoft.VisualStudio.Tools.Office.targets" -ErrorAction SilentlyContinue
            if ($target) {
              Write-Host "VSTO already installed: $($target[0].FullName)"
            } else {
              Write-Host "VSTO not found. Installing Office workload..."
              $argString = 'modify --installPath "' + $vsPath.TrimEnd('\') + '" --add Microsoft.VisualStudio.Workload.Office --includeRecommended --quiet --wait --norestart'
              Write-Host "Running installer..."
              $proc = Start-Process -FilePath $installer -ArgumentList $argString -Wait -NoNewWindow -PassThru
              Write-Host "Exit code: $($proc.ExitCode)"
              if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
                throw "Failed to install VSTO (exit code: $($proc.ExitCode))"
              }
            }
          } else {
            Write-Host "No VS found. Downloading VS Build Tools..."
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_buildtools.exe" -OutFile "vs_buildtools.exe"
            $argString = '--quiet --wait --norestart --installPath "C:\VS_BT" --add Microsoft.VisualStudio.Workload.Office --includeRecommended'
            $proc = Start-Process -FilePath "vs_buildtools.exe" -ArgumentList $argString -Wait -NoNewWindow -PassThru
            if ($proc.ExitCode -ne 0) { throw "VS Build Tools install failed (exit code: $($proc.ExitCode))" }
            $env:Path = "C:\VS_BT\MSBuild\Current\Bin;$env:Path"
          }

      - name: Fix VSTO targets path (junction)
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if (-not $vsPath) { Write-Host "vswhere failed, skipping junction"; return }
          # Detect VS version dynamically
          $vsDirs = Get-ChildItem (Join-Path $vsPath "MSBuild\Microsoft\VisualStudio") -Directory |
            Where-Object { $_.Name -match '^v\d+\.\d+$' } |
            Sort-Object Name -Descending
          if (-not $vsDirs) { Write-Host "No versioned MSBuild dir found, skipping"; return }
          $vsVerDir = $vsDirs[0].FullName
          $vsVer = $vsDirs[0].Name
          Write-Host "Detected VS MSBuild version: $vsVer"
          $officeDir = Join-Path $vsVerDir "Office"
          $officeToolsDir = Join-Path $vsVerDir "OfficeTools"
          if ((Test-Path $officeToolsDir) -and -not (Test-Path $officeDir)) {
            Write-Host "Creating junction: $officeDir -> $officeToolsDir"
            cmd.exe /c "mklink /J `"$officeDir`" `"$officeToolsDir`""
          } elseif (Test-Path $officeDir) {
            Write-Host "Office directory already exists: $officeDir"
          } else {
            Write-Host "Neither Office nor OfficeTools found at $vsVerDir"
          }

      - name: Download and install VSTO Runtime
        timeout-minutes: 10
        shell: pwsh
        run: |
          $url = "http://go.microsoft.com/fwlink/?LinkId=158918"
          Write-Host "Downloading VSTO Runtime from $url"
          Invoke-WebRequest -Uri $url -OutFile "vstor_redist.exe" -ErrorAction Stop
          $size = (Get-Item "vstor_redist.exe").Length
          if ($size -lt 100000) { throw "Downloaded file too small ($size bytes) - likely not a valid exe" }
          Write-Host "Downloaded: $size bytes"
          Write-Host "Installing VSTO Runtime (silent)..."
          $proc = Start-Process -FilePath ".\vstor_redist.exe" -ArgumentList "/quiet /norestart" -Wait -NoNewWindow -PassThru
          Write-Host "Install exit code: $($proc.ExitCode)"

      - name: Stage VSTO reference assemblies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path lib | Out-Null
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if (-not $vsPath) { throw "vswhere failed - cannot locate VS installation" }
          $vsRefDir = Join-Path $vsPath "Common7\IDE\ReferenceAssemblies\v4.0"

          # --- 3 VSTO runtime assemblies ---
          $needed = @("Microsoft.Office.Tools.Common.v4.0.Utilities", "Microsoft.Office.Tools.v4.0.Framework", "Microsoft.VisualStudio.Tools.Applications.Runtime")
          foreach ($asm in $needed) {
            $dest = Join-Path lib "$asm.dll"
            if (Test-Path $dest) { Write-Host "$asm OK"; continue }
            $path = Join-Path $vsRefDir "$asm.dll"
            if (Test-Path $path) { Copy-Item $path $dest -Force; Write-Host "$asm copied from VS ($((Get-Item $dest).Length) bytes)"; continue }
            throw "FATAL: $asm.dll not found!"
          }

          # --- Microsoft.Office.Core stub ---
          # VSTO runtime assemblies have a MANIFEST dependency on Microsoft.Office.Core.dll.
          # We generate a minimal stub assembly to satisfy the CLR assembly loader.
          # This allows CSC to load VSTO DLLs and resolve their types.
          #
          # Strategy: try csc.exe first (for correct AssemblyVersion), fall back to
          # PowerShell Add-Type (which we know compiles but produces version 0.0.0.0).
          # In either case, the explicit <Reference> in csproj ensures CSC loads the
          # stub unconditionally (no strong-name identity matching for explicit refs).
          $coreDest = Join-Path lib "Microsoft.Office.Core.dll"
          if (-not (Test-Path $coreDest)) {
            Write-Host "Generating Microsoft.Office.Core.dll stub..."
            $stubSource = "$env:RUNNER_TEMP\OfficeCoreStub.cs"
            # Base64-encoded C# source (avoids YAML colon-in-string issues)
            $b64 = ""
            [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($b64)) | Set-Content $stubSource -Encoding UTF8
            Write-Host "C# stub source: $((Get-Item $stubSource).Length) bytes"

            # Try csc.exe first (allows AssemblyVersion in manifest)
            $cscPaths = @(
              "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe",
              "C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe"
            )
            $csc = $cscPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
            $compiled = $false

            if ($csc) {
              Write-Host "Trying csc.exe: $csc"
              & $csc /target:library /out:$coreDest /noconfig /nostdlib- $stubSource 2>&1 | ForEach-Object { Write-Host "  [csc] $_" }
              if ($LASTEXITCODE -eq 0 -and (Test-Path $coreDest)) {
                $compiled = $true
                Write-Host "csc.exe succeeded: $((Get-Item $coreDest).Length) bytes"
              } else {
                Write-Host "csc.exe failed (exit $LASTEXITCODE), falling back to Add-Type..."
              }
            } else {
              Write-Host "csc.exe not found, falling back to Add-Type..."
            }

            if (-not $compiled) {
              Write-Host "Using Add-Type fallback..."
              Add-Type -TypeDefinition (Get-Content $stubSource -Raw) -OutputAssembly $coreDest -ErrorAction Stop
              Write-Host "Add-Type succeeded: $((Get-Item $coreDest).Length) bytes"
            }

            # Verify
            try {
              $a = [System.Reflection.Assembly]::LoadFrom((Resolve-Path $coreDest))
              Write-Host "Stub identity: $($a.FullName)"
            } catch {
              Write-Host "Stub load check: $_"
            }
          } else {
            Write-Host "Microsoft.Office.Core.dll OK"
          }

          Write-Host "All reference assemblies staged:"
          Get-ChildItem lib | ForEach-Object { Write-Host "  lib\$($_.Name) ($($_.Length) bytes)" }

          # Quick verification: can we load each staged DLL?
          Get-ChildItem lib -Filter "*.dll" | ForEach-Object {
            try {
              $a = [System.Reflection.Assembly]::LoadFrom($_.FullName)
              Write-Host "  $($_.Name) -> $($a.FullName)"
            } catch {
              Write-Host "  $($_.Name) -> Load warning: $_"
            }
          }

      - name: Build VSTO project
        shell: pwsh
        run: |
          Write-Host "Starting build..."
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if (-not $vsPath) { throw "vswhere failed to detect VS installation path" }
          $vstoRefPath = Join-Path $vsPath "Common7\IDE\ReferenceAssemblies\v4.0"
          # Note: lib\ is NOT added to ReferencePath because:
          # 1. All lib DLLs already have HintPath in the csproj file
          # 2. ForceVSTORefs target injects VSTO DLLs into @(ReferencePath) before CoreCompile
          # 3. MSBuild's command-line parser splits on ';' inside /p: value (MSB1006)
          Write-Host "ReferencePath: $vstoRefPath"
          Write-Host "--- lib contents ---"
          Get-ChildItem lib | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
          Write-Host "--- Starting MSBuild with detailed logging ---"
          msbuild AIPolishCOMAddin.csproj /restore /t:Build "/p:Configuration=Release" "/p:Platform=AnyCPU" /p:SignAssembly=false "/p:ReferencePath=$vstoRefPath" /p:UseSharedCompilation=false /v:d 2>&1 | Tee-Object -FilePath build.log
          Write-Host "--- Build exit code: $LASTEXITCODE ---"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "--- Last 100 lines of build log ---"
            Get-Content build.log -Tail 100
            throw "Build failed (exit $LASTEXITCODE)"
          }
          Write-Host "BUILD SUCCEEDED!"

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Package artifacts
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish
          Copy-Item "bin\Release\AIPolishCOMAddin.dll" "publish\" -ErrorAction Stop
          Copy-Item "install.bat", "uninstall.bat", "Register_Addin.reg", "Unregister_Addin.reg", "README.md" "publish\"
          $h = Get-FileHash "publish\AIPolishCOMAddin.dll" -Algorithm SHA256
          Set-Content "publish\AIPolishCOMAddin.dll.sha256" $h.Hash

      - uses: actions/upload-artifact@v4
        with:
          name: AIPolishCOMAddin-Release
          path: publish/
          if-no-files-found: error
