name: Build AI Paper Polish Addin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Install VSTO workload (Office/SharePoint)
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          if (-not (Test-Path $installer)) {
            $installer = "$env:ProgramFiles\Microsoft Visual Studio\Installer\vs_installer.exe"
          }

          if (Test-Path $installer) {
            $vswhere = Join-Path (Split-Path $installer) "vswhere.exe"
            $vsPath = if (Test-Path $vswhere) { & $vswhere -latest -property installationPath } else { "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" }
            Write-Host "VS installed at: $vsPath"

            $vstoDir = Join-Path $vsPath "MSBuild\Microsoft\VisualStudio"
            $target = Get-ChildItem $vstoDir -Recurse -Filter "Microsoft.VisualStudio.Tools.Office.targets" -ErrorAction SilentlyContinue
            if ($target) {
              Write-Host "VSTO already installed: $($target[0].FullName)"
            } else {
              Write-Host "VSTO not found. Installing Office workload..."
              $argString = 'modify --installPath "' + $vsPath.TrimEnd('\') + '" --add Microsoft.VisualStudio.Workload.Office --includeRecommended --quiet --wait --norestart'
              Write-Host "Running installer..."
              $proc = Start-Process -FilePath $installer -ArgumentList $argString -Wait -NoNewWindow -PassThru
              Write-Host "Exit code: $($proc.ExitCode)"
              if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
                throw "Failed to install VSTO (exit code: $($proc.ExitCode))"
              }
            }
          } else {
            Write-Host "No VS found. Downloading VS Build Tools..."
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_buildtools.exe" -OutFile "vs_buildtools.exe"
            $argString = '--quiet --wait --norestart --installPath "C:\VS_BT" --add Microsoft.VisualStudio.Workload.Office --includeRecommended'
            $proc = Start-Process -FilePath "vs_buildtools.exe" -ArgumentList $argString -Wait -NoNewWindow -PassThru
            if ($proc.ExitCode -ne 0) { throw "VS Build Tools install failed (exit code: $($proc.ExitCode))" }
            $env:Path = "C:\VS_BT\MSBuild\Current\Bin;$env:Path"
          }

      - name: Fix VSTO targets path (junction for VS2026+)
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $v18 = Join-Path $vsPath "MSBuild\Microsoft\VisualStudio\v18.0"
          $officeDir = Join-Path $v18 "Office"
          $officeToolsDir = Join-Path $v18 "OfficeTools"
          if ((Test-Path $officeToolsDir) -and -not (Test-Path $officeDir)) {
            Write-Host "Creating junction: $officeDir -> $officeToolsDir"
            cmd.exe /c "mklink /J `"$officeDir`" `"$officeToolsDir`""
          } elseif (Test-Path $officeDir) {
            Write-Host "Office directory already exists: $officeDir"
          } else {
            Write-Host "Neither Office nor OfficeTools found at $v18"
          }

      - name: Copy VSTO runtime assemblies to reference path
        shell: pwsh
        run: |
          $refDir = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\VSTO40\v4.0"
          if (-not (Test-Path $refDir)) {
            Write-Host "Creating reference directory: $refDir"
            New-Item -ItemType Directory -Force -Path $refDir | Out-Null
          }
          # Find VSTO runtime assemblies in GAC and copy to reference path
          $gacRoot = "C:\Windows\Microsoft.NET\assembly\GAC_MSIL"
          $needed = @("Microsoft.Office.Tools.Common.v4.0.Utilities", "Microsoft.Office.Tools.v4.0.Framework", "Microsoft.VisualStudio.Tools.Applications.Runtime")
          foreach ($asm in $needed) {
            $paths = Get-ChildItem "$gacRoot\$asm" -Filter "*.dll" -Recurse -ErrorAction SilentlyContinue
            $found = $false
            foreach ($dll in $paths) {
              $dest = Join-Path $refDir "$asm.dll"
              Write-Host "Copying $($dll.FullName) -> $dest"
              Copy-Item $dll.FullName $dest -Force
              $found = $true
            }
            if (-not $found) { Write-Host "WARNING: $asm not found in GAC" }
          }

      - name: Build VSTO project
        shell: pwsh
        run: |
          Write-Host "Starting build..."
          msbuild AIPolishCOMAddin.csproj /restore /t:Build "/p:Configuration=Release" "/p:Platform=AnyCPU" /p:SignAssembly=false /v:m
          if ($LASTEXITCODE -ne 0) { throw "Build failed (exit $LASTEXITCODE)" }
          Write-Host "BUILD SUCCEEDED!"

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish
          Copy-Item "bin\Release\AIPolishCOMAddin.dll" "publish\" -ErrorAction Stop
          Copy-Item "install.bat", "uninstall.bat", "Register_Addin.reg", "Unregister_Addin.reg", "README.md" "publish\"
          $h = Get-FileHash "publish\AIPolishCOMAddin.dll" -Algorithm SHA256
          Set-Content "publish\AIPolishCOMAddin.dll.sha256" $h.Hash

      - uses: actions/upload-artifact@v4
        with:
          name: AIPolishCOMAddin-Release
          path: publish/
          if-no-files-found: error
